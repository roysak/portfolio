    <!-- Resolve the design/code mode before first paint so the ground never flashes -->
    <script>
      (function () {
        var m = "design";
        try {
          var stored = localStorage.getItem("mode");
          if (stored === "design" || stored === "code") m = stored;
          // ?mode=code makes either half of the site directly linkable
          var q = new URLSearchParams(location.search).get("mode");
          if (q === "design" || q === "code") {
            m = q;
            localStorage.setItem("mode", m);
          }
        } catch (e) { /* storage unavailable */ }
        var r = document.documentElement;
        r.setAttribute("data-mode", m);
        r.style.colorScheme = m === "code" ? "dark" : "light";
      })();
    </script>
